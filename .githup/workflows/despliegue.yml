name: Despliegue Automático a InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Subiendo archivos por FTP
    runs-on: ubuntu-latest
    steps:
    - name: Descargando el código de GitHub
      uses: actions/checkout@v3
    
    - name: Sincronizando con InfinityFree
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /htdocs/
        timeout: 60000        # <--- Esto le da más tiempo para que no de Timeout
        dangerous-clean-slate: false